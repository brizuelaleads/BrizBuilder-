<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      /*
        Intentionally unbranded: this page is precached and shared by every
        tenant on the host, so it uses neutral system colours rather than any
        one client's palette.
      */
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #191a1f;
        background: #f7f7f4;
      }
      main { max-width: 22rem; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 1.25rem; }
      p { margin: 0 0 20px; color: #6f737b; font-size: .9rem; line-height: 1.5; }
      button {
        padding: 10px 18px;
        border: 1px solid currentcolor;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f8f8f8; background: #000; }
        p { color: #a7a7a7; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Your workspace needs a connection to load. It will pick up right where
        you left off once you are back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
